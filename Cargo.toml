[package]
name = "sayanox"
version = "0.3.3"
edition = "2021"
authors = ["Sayan Mahata <sm6881164@gmail.com>"]
description = "Sayanox - An original easy programming language with its own compiler"
license = "MIT"
repository = "https://github.com/sayan9168/sayanox"

[dependencies]
# Cranelift for native code generation (optional feature)
cranelift-codegen = { version = "0.110", optional = true }
cranelift-frontend = { version = "0.110", optional = true }
cranelift-module = { version = "0.110", optional = true }
cranelift-native = { version = "0.110", optional = true }
cranelift-jit = { version = "0.110", optional = true }
target-lexicon = { version = "0.12", optional = true }

[features]
default = []
native = ["cranelift-codegen", "cranelift-frontend", "cranelift-module", "cranelift-native", "cranelift-jit", "target-lexicon"]

[[bin]]
name = "sayanox"
path = "src/main.rs"
