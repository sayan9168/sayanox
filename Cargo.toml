[package]
name = "sayanox"
version = "0.5.0"
edition = "2021"
authors = ["Sayan Mahata <sm6881164@gmail.com>"]
description = "Sayanox optional Rust host (std only). Primary compiler is Stage-2 C + sx."
license = "MIT"
repository = "https://github.com/sayan9168/sayanox"

# Zero external crates — Rust standard library only.
# You do NOT need Cargo for normal Sayanox use (use ./selfhost/sx).
[dependencies]

[[bin]]
name = "sayanox"
path = "src/main.rs"
