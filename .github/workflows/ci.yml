name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selfhost:
    name: Supported self-host smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Stage-2 through Make
        run: make stage2

      - name: Production bootstrap
        run: bash selfhost/bootstrap_production.sh

      - name: Examples smoke
        run: |
          chmod +x selfhost/sx
          ./selfhost/sx examples/hello.sa --run
          ./selfhost/sx examples/countdown.sa --run
          ./selfhost/sx examples/greet.sa --run

      - name: Formatter smoke
        run: |
          chmod +x tools/sxfmt.sh
          ./tools/sxfmt.sh examples/hello.sa | grep -q show
