name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sayanox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap / grammar / pure-gen2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc make python3

      - name: Verify shell scripts
        run: |
          bash -n selfhost/bootstrap_subset.sh
          bash -n selfhost/bootstrap_seed.sh
          bash -n selfhost/bootstrap_gen1.sh
          bash -n selfhost/bootstrap_gen2.sh
          bash -n selfhost/bootstrap_grammar.sh

      - name: Full bootstrap
        run: make all

      - name: Grammar growth regression
        run: make grammar

      - name: Full test suite
        run: make test

      - name: Native target
        run: make native-test

      - name: Runtime / GC target
        run: make gc-test

  clean-tree:
    name: Generated-file hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Check tracked generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e selfhost/gen1.c
          test ! -e selfhost/gen2.c
          test ! -e selfhost/boot.c
          test ! -e selfhost/boot2.c
          test ! -e selfhost/gen1
          test ! -e selfhost/gen2
          test ! -e selfhost/boot
          test ! -e selfhost/boot2
