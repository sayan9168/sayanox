name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  selfhost:
    name: Supported smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage-2
        run: make stage2

      - name: Production (Sayanox driver)
        run: make bootstrap-production

      - name: Native bootstrap (no Stage-2 for cases)
        run: make bootstrap-native

      - name: SX CLI
        run: |
          make sx
          ./selfhost/sx examples/hello.sa --run

      - name: sxfmt.sa tool
        run: |
          make tools
          ./tools/sxfmt_bin examples/hello.sa /tmp/fmt.sa
