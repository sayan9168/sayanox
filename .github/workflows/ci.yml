name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-host:
    name: Rust host build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
      - name: Compile hello via host
        run: |
          cargo build --release
          ./target/release/sayanox examples/hello.sa -o /tmp/host_hello.c
          clang /tmp/host_hello.c -o /tmp/host_hello
          /tmp/host_hello

  stage2:
    name: Complete Stage-2 + self-host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap Stage-2
        run: |
          chmod +x selfhost/restore_stage2.sh selfhost/bootstrap_selfhost.sh selfhost/sx
          ./selfhost/bootstrap_selfhost.sh
