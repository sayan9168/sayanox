name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sayanox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Bootstrap / grammar / pure-gen2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc make python3

      - name: Verify shell scripts
        shell: bash
        run: |
          set -euo pipefail
          for f in             selfhost/bootstrap_subset.sh             selfhost/bootstrap_seed.sh             selfhost/bootstrap_gen1.sh             selfhost/bootstrap_gen2.sh             selfhost/bootstrap_grammar.sh
          do
            bash -n "$f"
          done

      - name: Full bootstrap
        run: make all

      - name: Grammar growth regression
        run: make grammar

      - name: Full test suite
        run: make test

      - name: Native target
        run: make native-test

      - name: Runtime / GC target
        run: make gc-test

      - name: Verify generated artifacts are not tracked
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          for f in             selfhost/gen1.c selfhost/gen2.c             selfhost/boot.c selfhost/boot2.c             selfhost/gen1 selfhost/gen2             selfhost/boot selfhost/boot2
          do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f is tracked but must be generated"
              exit 1
            fi
          done

  clean-tree:
    name: Clean checkout hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
      - name: Verify repository checkout
        run: git status --short
