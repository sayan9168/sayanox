name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-host:
    name: Rust host build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
      - name: Parser conformance - valid
        run: cargo run --quiet -- selfhost/parser_demo.sa --check
      - name: Parser conformance - invalid
        shell: bash
        run: |
          set +e
          cargo run --quiet -- selfhost/parser_invalid.sa --check >/tmp/parser_invalid.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -Eq 'line|column|Expected|Unexpected' /tmp/parser_invalid.log
      - name: Hello via first-party VM
        run: |
          cargo build --release
          ./target/release/sayanox examples/hello.sa --run
      - name: Hello via C compatibility backend
        run: |
          ./target/release/sayanox examples/hello.sa -o /tmp/host_hello.c
          clang /tmp/host_hello.c -o /tmp/host_hello
          /tmp/host_hello

  selfhost:
    name: Deep Stage-2 self-host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Full bootstrap
        run: |
          chmod +x selfhost/restore_stage2.sh selfhost/bootstrap_selfhost.sh selfhost/sx
          ./selfhost/bootstrap_selfhost.sh

  stage3:
    name: Stage-3 self-host bootstrap
    runs-on: ubuntu-latest
    needs: [rust-host, selfhost]
    steps:
      - uses: actions/checkout@v4
      - name: Run complete Stage-3 bootstrap
        run: |
          chmod +x selfhost/bootstrap_stage3.sh selfhost/restore_stage2.sh selfhost/sx
          ./selfhost/bootstrap_stage3.sh

  stage4:
    name: Stage-4 self-hosted toolchain
    runs-on: ubuntu-latest
    needs: [stage3]
    steps:
      - uses: actions/checkout@v4
      - name: Run Rust-free compiler chain
        run: |
          chmod +x selfhost/stage4_toolchain.sh selfhost/restore_stage2.sh
          ./selfhost/stage4_toolchain.sh
