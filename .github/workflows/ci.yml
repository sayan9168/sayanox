name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  subset-selfhost:
    name: Subset self-host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build subset compiler and run regression suite
        run: make subset

      - name: Verify existing-gen1 path
        run: make subset-existing

      - name: Build formatter with gen1
        run: make tools

  native-aot:
    name: Native AOT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native compiler and run executable smoke test
        run: make native-test
