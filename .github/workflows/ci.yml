name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sayanox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CC: cc
  LC_ALL: C

jobs:
  migrated-gates:
    name: Sayanox entry and migrated acceptance gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Verify reviewed entry and source checksums before execution
        run: sha256sum -c bootstrap/sx.sha256
      - name: Arm native Sayanox runtime and network guards before bootstrap
        run: ./sx ci-guard
      - name: Rebuild and compare the native Sayanox entry
        run: ./sx verify-entry
      - name: Prove native bootstrap without a C seed or C compiler
        run: ./sx target test-native-bootstrap
      - name: Driver, no-build-file and poison-build-tool integration
        run: ./sx target doctor test-driver
      - name: Remaining stdlib, bootstrap resource budget and workflow shape
        run: ./sx target test-remaining-stdlib
      - name: Remaining implemented acceptance executables
        run: ./sx target test-sxpkg-pubkey test-sxpkg-transfer-hardening test-sxc-native test-sxisaexec test-sxmod-deep
      - name: Check forbidden invocation evidence, even after a failed gate
        if: always()
        run: ./sx ci-guard-check

  full-acceptance-blocker:
    name: Complete original acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Verify reviewed entry and source checksums before execution
        run: sha256sum -c bootstrap/sx.sha256
      - name: Arm native Sayanox runtime and network guards before bootstrap
        run: ./sx ci-guard
      # Do not use continue-on-error or substitute only a smaller migrated subset.
      # ci retains doctor -> true-selfhost -> gen3 -> native-test, preceded by
      # the complete-coverage and workflow-shape gates. No missing gate passes.
      - name: Require complete migration and original hard gates
        run: ./sx ci
      - name: Check forbidden invocation evidence, even after a failed gate
        if: always()
        run: ./sx ci-guard-check
