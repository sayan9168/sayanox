name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-host:
    name: Rust host build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
      - name: Hello via VM
        run: |
          cargo build --release
          ./target/release/sayanox examples/hello.sa --run
      - name: Hello via C backend
        run: |
          ./target/release/sayanox examples/hello.sa -o /tmp/host_hello.c
          clang /tmp/host_hello.c -o /tmp/host_hello
          test "$(/tmp/host_hello)" = "42"
      - name: Parser check (optional fixtures)
        run: |
          if [[ -f selfhost/parser_demo.sa ]]; then
            cargo run --quiet -- selfhost/parser_demo.sa --check || true
          fi

  selfhost:
    name: Stage-2 self-host smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap smoke
        run: |
          chmod +x selfhost/restore_stage2.sh selfhost/bootstrap_selfhost.sh selfhost/sx
          ./selfhost/bootstrap_selfhost.sh

  stage3:
    name: Stage-3 bootstrap
    runs-on: ubuntu-latest
    needs: [selfhost]
    steps:
      - uses: actions/checkout@v4
      - name: Stage-3
        run: |
          chmod +x selfhost/bootstrap_stage3.sh selfhost/restore_stage2.sh selfhost/sx
          ./selfhost/bootstrap_stage3.sh

  stage4:
    name: Stage-4 toolchain
    runs-on: ubuntu-latest
    needs: [stage3]
    steps:
      - uses: actions/checkout@v4
      - name: Stage-4
        run: |
          chmod +x selfhost/stage4_toolchain.sh selfhost/restore_stage2.sh
          ./selfhost/stage4_toolchain.sh
