name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sayanox-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: true-selfhost (Makefile only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc make

      - name: True full self-host
        run: make true-selfhost

      - name: make all
        run: make all

      - name: Grammar target
        run: make grammar

      - name: Full test suite
        run: make test

      - name: Native / GC placeholders
        run: |
          make native-test
          make gc-test

      - name: Verify generated artifacts are not tracked
        run: |
          set -e
          for f in selfhost/gen1.c selfhost/gen2.c selfhost/boot.c selfhost/boot2.c \
                   selfhost/gen1 selfhost/gen2 selfhost/boot selfhost/boot2; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f is tracked but must be generated"
              exit 1
            fi
          done

  clean-tree:
    name: Clean checkout hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
      - name: Verify repository checkout
        run: git status --short
