name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x selfhost/restore_sxc_full.sh && ./selfhost/restore_sxc_full.sh
      - run: make subset
      - run: make pure-gen2
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make native-test
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make gc-test
