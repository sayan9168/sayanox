name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore minimal sxc_full
        run: |
          chmod +x selfhost/restore_sxc_full.sh
          ./selfhost/restore_sxc_full.sh
          test -f selfhost/sxc_full.c
      - name: Subset smoke
        run: |
          chmod +x selfhost/bootstrap_subset.sh
          ./selfhost/bootstrap_subset.sh
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seed compiler (Phase 2)
        run: |
          chmod +x selfhost/bootstrap_seed.sh
          ./selfhost/bootstrap_seed.sh
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make native-test || echo "native skip"
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make gc-test || echo "rc skip"
