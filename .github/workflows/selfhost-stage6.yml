name: Sayanox Stage-6 Self-Hosted Type Environment

on:
  push:
    branches: [main]
    paths:
      - "selfhost/typeenv.sa"
      - "selfhost/stage6_typeenv.sh"
      - "selfhost/restore_stage2.sh"
      - "selfhost/sx"
      - ".github/workflows/selfhost-stage6.yml"
  pull_request:
    paths:
      - "selfhost/typeenv.sa"
      - "selfhost/stage6_typeenv.sh"
      - "selfhost/restore_stage2.sh"
      - "selfhost/sx"
      - ".github/workflows/selfhost-stage6.yml"

jobs:
  stage6-typeenv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bootstrap compiler tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Run Stage-6 type environment
        run: bash selfhost/stage6_typeenv.sh
