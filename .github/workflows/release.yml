name: release

# Sayanox owns gate selection, evidence, packaging and publication arguments.
# Nothing is published while any baseline acceptance target remains pending.
# git archive and gh are leaf host boundaries, not workflow shell recipes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or use (e.g. v0.3.30)"
        required: true
        default: "v0.3.30"

permissions:
  contents: write

concurrency:
  group: sayanox-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CC: cc
  LC_ALL: C
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    name: "gated release: four hard gates, then publish"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Clean checkout
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1

      - name: Verify reviewed entry and source checksums before execution
        run: sha256sum -c bootstrap/sx.sha256
      - name: Arm native Sayanox runtime and network guards before bootstrap
        run: ./sx ci-guard

      - name: Rebuild and compare the Sayanox entry
        run: ./sx verify-entry

      # This MUST fail while any original target remains unported. Packaging
      # and publishing below are unreachable until complete acceptance passes.
      - name: Complete acceptance, package evidence and publish through Sayanox
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./sx release

      - name: Check forbidden invocation evidence, even after a failed gate
        if: always()
        run: ./sx ci-guard-check
