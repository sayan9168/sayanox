name: full-bootstrap

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

env:
  CC: cc
  LC_ALL: C

jobs:
  full-bootstrap:
    name: Clean source rebuild and full acceptance (fail closed)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
      - name: Verify reviewed entry and source checksums before execution
        run: sha256sum -c bootstrap/sx.sha256
      - name: Arm native Sayanox runtime and network guards before bootstrap
        run: ./sx ci-guard
      - name: Reconstruct Sayanox native compiler from its pinned native anchor and verify entry
        run: ./sx verify-entry
      - name: Prove native bootstrap without a C seed or C compiler
        run: ./sx target test-native-bootstrap
      - name: Require every original acceptance gate, not only the ported subset
        run: ./sx ci
      - name: Check forbidden invocation evidence, even after a failed gate
        if: always()
        run: ./sx ci-guard-check
